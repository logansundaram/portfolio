<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 25 25" shape-rendering="crispEdges">
  <!-- Corner-bracket reticle, matching the readout box corners. Hotspot = (12,12). -->
  <!-- Halo: translucent dark outline so it stays visible over amber text. -->
  <g fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="3" stroke-linecap="butt">
    <path d="M4.5 9.5v-5h5"/>
    <path d="M15.5 4.5h5v5"/>
    <path d="M20.5 15.5v5h-5"/>
    <path d="M9.5 20.5h-5v-5"/>
  </g>
  <rect x="10" y="10" width="5" height="5" fill="#000" fill-opacity="0.6"/>
  <!-- Brackets: zinc-300 -->
  <g fill="none" stroke="#d4d4d8" stroke-width="1" stroke-linecap="butt">
    <path d="M4.5 9.5v-5h5"/>
    <path d="M15.5 4.5h5v5"/>
    <path d="M20.5 15.5v5h-5"/>
    <path d="M9.5 20.5h-5v-5"/>
  </g>
  <!-- Center tick: amber-500 -->
  <rect x="11" y="11" width="3" height="3" fill="#f59e0b"/>
</svg>
